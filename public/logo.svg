<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" fill="none">
  <!-- AC Unit Icon -->
  <g transform="translate(140, 10)">
    <rect x="0" y="0" width="60" height="40" rx="2" fill="none" stroke="#1a3a5c" stroke-width="2"/>
    <line x1="10" y1="10" x2="50" y2="10" stroke="#1a3a5c" stroke-width="2"/>
    <line x1="10" y1="18" x2="50" y2="18" stroke="#1a3a5c" stroke-width="2"/>
    <line x1="10" y1="26" x2="50" y2="26" stroke="#1a3a5c" stroke-width="2"/>
    <line x1="10" y1="34" x2="50" y2="34" stroke="#1a3a5c" stroke-width="2"/>
    <!-- Pipe -->
    <path d="M 60 20 L 75 20 L 75 35 L 85 35" stroke="#1a3a5c" stroke-width="2" fill="none"/>
  </g>

  <!-- HVACR Text -->
  <g font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="72">
    <!-- H - Red -->
    <text x="10" y="120" fill="#e63946">H</text>
    <!-- V - Green -->
    <text x="70" y="120" fill="#2d6a4f">V</text>
    <!-- A - Yellow/Orange -->
    <text x="125" y="120" fill="#f4a261">A</text>
    <!-- C - Orange -->
    <text x="185" y="120" fill="#e76f51">C</text>
    <!-- R - Blue -->
    <text x="245" y="120" fill="#1d3557">R</text>
  </g>

  <!-- NET Text -->
  <g font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="36">
    <text x="270" y="60" fill="#f4a261">NET</text>
  </g>

  <!-- Small pipe decoration -->
  <path d="M 310 50 L 325 50 L 325 65 L 335 65" stroke="#f4a261" stroke-width="2" fill="none"/>
</svg>
